<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="狭小空间巡检机器人以微型移动平台搭载超冗余机械臂进入管道内部巡检示意">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>
    <pattern id="gridB" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1d4ed8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="coneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" fill="url(#bgB)"/>
  <rect width="900" height="540" fill="url(#gridB)"/>

  <!-- 标题 -->
  <text x="40" y="60" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#0f2e63" letter-spacing="2">NARROW-SPACE INSPECTION</text>
  <text x="40" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#1d4ed8">狭小空间巡检机器人</text>

  <!-- 管道剖面：上下管壁 -->
  <g>
    <rect x="70" y="196" width="760" height="44" rx="22" fill="#e6efff" stroke="#0f2e63" stroke-width="4"/>
    <rect x="70" y="340" width="760" height="44" rx="22" fill="#e6efff" stroke="#0f2e63" stroke-width="4"/>
    <path d="M96 232H804" stroke="#ffffff" stroke-width="6" stroke-opacity="0.85"/>
    <path d="M96 348H804" stroke="#ffffff" stroke-width="6" stroke-opacity="0.85"/>
    <!-- 管壁缺陷 -->
    <path d="M672 244l11-9 9 8 12-9" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 扫描视锥 -->
  <path d="M630 262L724 198V320Z" fill="url(#coneB)"/>

  <!-- 超冗余机械臂：微型平台 → 逐节蜿蜒前进 → 末端传感器 -->
  <g>
    <polyline points="228,300 290,284 346,308 400,296 450,266 498,246 548,252 592,276 630,262" fill="none" stroke="#0f2e63" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="228,300 290,284 346,308 400,296 450,266 498,246 548,252 592,276 630,262" fill="none" stroke="#eff4ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    <g fill="#ffffff" stroke="#1d4ed8" stroke-width="3.5">
      <circle cx="290" cy="284" r="8"/><circle cx="346" cy="308" r="8"/><circle cx="400" cy="296" r="8"/>
      <circle cx="450" cy="266" r="8"/><circle cx="498" cy="246" r="8"/><circle cx="548" cy="252" r="8"/><circle cx="592" cy="276" r="8"/>
    </g>
    <!-- 末端传感器 -->
    <g transform="rotate(-22 630 262)">
      <rect x="612" y="248" width="40" height="28" rx="7" fill="#1d4ed8"/>
      <circle cx="660" cy="262" r="8" fill="#ffffff" stroke="#0f2e63" stroke-width="3"/>
    </g>
  </g>

  <!-- 微型移动平台 -->
  <g>
    <rect x="112" y="278" width="116" height="44" rx="12" fill="#eff4ff" stroke="#0f2e63" stroke-width="4"/>
    <circle cx="142" cy="330" r="14" fill="#0f2e63"/>
    <circle cx="200" cy="330" r="14" fill="#0f2e63"/>
    <circle cx="142" cy="330" r="5" fill="#eff4ff"/>
    <circle cx="200" cy="330" r="5" fill="#eff4ff"/>
  </g>

  <!-- 识别框：命中管壁缺陷 -->
  <g>
    <rect x="664" y="216" width="62" height="36" fill="none" stroke="#d4af37" stroke-width="5"/>
    <path d="M664 216h-14M726 216h14M664 252h-14M726 252h14" stroke="#d4af37" stroke-width="5"/>
  </g>

  <!-- 说明与参数 -->
  <text x="70" y="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#0f2e63">微型移动平台 + 超冗余机械臂 · 无孔不入的近距离感知</text>
  <text x="870" y="522" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#b8860b">6in PIPE &#183; VISION + THERMAL + 3D LIDAR</text>
</svg>
