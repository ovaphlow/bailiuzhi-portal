<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="蛇形机械臂穿过狭小舱口进入机身内部执行紧固件检测示意">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>
    <pattern id="gridA" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1d4ed8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="coneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" fill="url(#bgA)"/>
  <rect width="900" height="540" fill="url(#gridA)"/>

  <!-- 标题 -->
  <text x="40" y="60" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#0f2e63" letter-spacing="2">SNAKE-ARM ROBOT</text>
  <text x="40" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#1d4ed8">蛇形机械臂 · 受限空间避障</text>

  <!-- 机身蒙皮面板 + 紧固件 -->
  <g>
    <rect x="520" y="88" width="330" height="190" rx="14" fill="#ffffff" stroke="#0f2e63" stroke-width="5"/>
    <g fill="#e6efff" stroke="#0f2e63" stroke-width="3">
      <circle cx="560" cy="128" r="7"/><circle cx="610" cy="128" r="7"/><circle cx="660" cy="128" r="7"/><circle cx="710" cy="128" r="7"/><circle cx="760" cy="128" r="7"/><circle cx="810" cy="128" r="7"/>
      <circle cx="560" cy="168" r="7"/><circle cx="610" cy="168" r="7"/><circle cx="660" cy="168" r="7"/><circle cx="710" cy="168" r="7"/><circle cx="760" cy="168" r="7"/><circle cx="810" cy="168" r="7"/>
      <circle cx="560" cy="208" r="7"/><circle cx="610" cy="208" r="7"/><circle cx="660" cy="208" r="7"/><circle cx="710" cy="208" r="7"/><circle cx="760" cy="208" r="7"/><circle cx="810" cy="208" r="7"/>
      <circle cx="560" cy="248" r="7"/><circle cx="610" cy="248" r="7"/><circle cx="660" cy="248" r="7"/><circle cx="710" cy="248" r="7"/><circle cx="760" cy="248" r="7"/><circle cx="810" cy="248" r="7"/>
    </g>
    <text x="685" y="68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#0f2e63">飞机蒙皮 · 紧固件检测</text>
  </g>

  <!-- 舱壁与狭小入口 -->
  <g>
    <rect x="252" y="150" width="96" height="350" fill="#e6efff" stroke="#0f2e63" stroke-width="4"/>
    <g stroke="#1d4ed8" stroke-opacity="0.22" stroke-width="3">
      <path d="M252 196H348M252 236H348M252 430H348M252 470H348"/>
    </g>
    <circle cx="300" cy="330" r="52" fill="#f7faff" stroke="#0f2e63" stroke-width="5"/>
    <circle cx="300" cy="330" r="40" fill="none" stroke="#1d4ed8" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- 末端相机视锥 -->
  <path d="M452 186L700 116V262Z" fill="url(#coneA)"/>

  <!-- 蛇形机械臂：基座 → 逐节穿过舱口 → 末端相机 -->
  <g>
    <polyline points="58,470 128,430 196,392 268,356 336,302 382,258 420,218 452,186" fill="none" stroke="#0f2e63" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="58,470 128,430 196,392 268,356 336,302 382,258 420,218 452,186" fill="none" stroke="#eff4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    <g fill="#ffffff" stroke="#1d4ed8" stroke-width="4">
      <circle cx="128" cy="430" r="11"/><circle cx="196" cy="392" r="11"/><circle cx="268" cy="356" r="11"/>
      <circle cx="336" cy="302" r="11"/><circle cx="382" cy="258" r="11"/><circle cx="420" cy="218" r="11"/>
    </g>
    <!-- 基座 -->
    <rect x="30" y="450" width="96" height="40" rx="10" fill="#eff4ff" stroke="#0f2e63" stroke-width="4"/>
    <rect x="44" y="498" width="126" height="26" rx="7" fill="#ffffff" stroke="#0f2e63" stroke-width="3"/>
    <!-- 末端相机 -->
    <g transform="rotate(-38 452 186)">
      <rect x="428" y="170" width="48" height="32" rx="8" fill="#1d4ed8"/>
      <circle cx="486" cy="186" r="9" fill="#ffffff" stroke="#0f2e63" stroke-width="3"/>
    </g>
  </g>

  <!-- 识别框：命中待检紧固件 -->
  <g>
    <rect x="592" y="150" width="36" height="36" fill="none" stroke="#d4af37" stroke-width="5"/>
    <path d="M592 150h-14M628 150h14M592 186h-14M628 186h14" stroke="#d4af37" stroke-width="5"/>
  </g>

  <!-- 参数 -->
  <text x="870" y="522" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#b8860b">4.5m ARM &#183; 10 DOF &#183; 5kg PAYLOAD</text>
</svg>
