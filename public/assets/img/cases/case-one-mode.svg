<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="复杂零部件一模到底的设计、检测一体化示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1d4ed8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <rect width="900" height="540" fill="url(#grid)"/>

  <!-- MBD 模型 + 尺寸标注 -->
  <g>
    <path d="M130 348V196L286 130L442 196V348L286 414Z" fill="#ffffff" stroke="#0f2e63" stroke-width="5" stroke-linejoin="round"/>
    <path d="M286 130V248M130 196L286 248M442 196L286 248M286 414V248" fill="none" stroke="#0f2e63" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="286" cy="196" r="26" fill="#eff4ff" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="286" cy="196" r="9" fill="#1d4ed8" fill-opacity="0.5"/>
    <!-- 尺寸链 -->
    <path d="M130 452H442" stroke="#d4af37" stroke-width="4"/>
    <path d="M148 444L130 452L148 460M424 444L442 452L424 460" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="286" y="492" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#b8860b">MBD MODEL</text>
  </g>

  <!-- 测针自动配置与测点 -->
  <g>
    <path d="M690 118L630 244" stroke="#0f2e63" stroke-width="8" stroke-linecap="round"/>
    <circle cx="694" cy="112" r="16" fill="#eff4ff" stroke="#0f2e63" stroke-width="4"/>
    <path d="M630 244L604 300" stroke="#0f2e63" stroke-width="4" stroke-dasharray="6 6"/>
    <circle cx="600" cy="308" r="10" fill="#d4af37"/>
    <rect x="536" y="330" width="140" height="76" rx="8" fill="#1d4ed8" fill-opacity="0.14" stroke="#1d4ed8" stroke-width="4"/>
    <g fill="#d4af37">
      <circle cx="566" cy="368" r="7"/>
      <circle cx="606" cy="356" r="7"/>
      <circle cx="646" cy="376" r="7"/>
    </g>
    <path d="M566 300H646" stroke="#d4af37" stroke-width="4"/>
    <path d="M584 292L566 300L584 308" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="606" y="452" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#b8860b">AUTO PROBE</text>
  </g>

  <!-- 提效对比：人工 vs 自动 -->
  <g>
    <rect x="130" y="500" width="0" height="0" fill="none"/>
    <rect x="536" y="486" width="200" height="14" rx="7" fill="#1d4ed8" fill-opacity="0.22"/>
    <rect x="536" y="486" width="58" height="14" rx="7" fill="#d4af37"/>
    <text x="748" y="500" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#0f2e63">+60%</text>
  </g>
</svg>
